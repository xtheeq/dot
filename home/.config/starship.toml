palette = "noctalia"
# Was 999999999999999999, which made the prompt wait ~forever on a hung command
# (e.g. the Vite+ `node` shim downloading a runtime) and froze the whole TTY.
command_timeout = 2000

format = """$character"""
right_format = """$all"""

# Don't shell out to `node` on every prompt. In repos where `node` is the
# Vite+ shim that needs to download a runtime, this blocks the prompt.
[nodejs]
disabled = true

