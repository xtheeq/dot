# Give every app mango spawns (terminals, zellij, status bar, ...) a PATH that
# includes the user-local bin dirs. Greetd starts mango with a minimal PATH,
# which is why `mise` (in ~/.local/bin) is not found inside zellij panes.
env=PATH,/home/atheeq/.local/bin:/home/atheeq/.opencode/bin:/home/atheeq/.local/share/pnpm/bin:/home/atheeq/.local/share/vite-plus/bin:/home/atheeq/.cargo/bin:/usr/lib64/ccache:/usr/local/bin:/usr/bin:/home/atheeq/.local/share/vite-plus/fallback-bin

# Autostart
exec_once = noctalia

# Input
xkb_rules_options=caps:swapescape
drag_tile_to_tile=1
trackpad_natural_scrolling=1

# Window Rules
window_rule=is_named_scratchpad:1,app_id:dev.noctalia.Noctalia,width:1536,height:935
window_rule=is_named_scratchpad:1,app_id:org.ghostty.scratchpad,width:1536,height:935

source=~/.config/mango/layout.conf
source=~/.config/mango/animations.conf
source=~/.config/mango/appearance.conf
source=~/.config/mango/binds.conf
source=~/.config/mango/noctalia.conf
