# Umbriel-style scrolling workspace overview
# Mirrors Umbriel's defaults: 0.5 zoom, vertical filmstrip,
# 10% row gap, 250 ms transitions, no per-card dim.
# Cell size: 1920x1080 * 0.5 = 960x540
# Gap: 0.1 * 1080 * 0.5 = 54px

workspace_overview_scroll_direction=horizontal
workspace_overview_scroll_ratio=0.5
workspace_overview_border_width=0
workspace_overview_gap=54
workspace_overview_drag_threshold=10
workspace_overview_drag_scroll_speed=1.5
workspace_overview_focused_dim_opacity=0.0
workspace_overview_unfocused_dim_opacity=0.0

animation_duration_workspace_overview_open=250
animation_duration_workspace_overview_close=250
animation_duration_workspace_overview_move=250
animation_curve_workspace_overview_open=0.16,1.0,0.3,1.0
animation_curve_workspace_overview_close=0.16,1.0,0.3,1.0
animation_curve_workspace_overview_move=0.16,1.0,0.3,1.0
